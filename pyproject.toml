[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prayer-times"
dynamic = ["version"]
description = "Hadith-based Islamic prayer time calculator (CLI + PySide6 GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ismail", email = "ismail@example.com"}]
keywords = ["islam", "prayer", "salah", "hadith", "fajr", "isha"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Religion",
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
# Needed only for the "PCD + NREL SPA" mode.
spa = ["pandas>=2.0.0", "pytz>=2024.1", "pvlib>=0.10.0"]
dev = ["build", "ruff"]

[project.scripts]
prayer-times     = "prayer_times.cli:main"
prayer-times-gui = "prayer_times.gui:main"

[tool.setuptools.dynamic]
version = {attr = "prayer_times.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prayer_times = ["config.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# real errors only: syntax, import problems, undefined names
select = ["E4", "E7", "E9", "F"]
